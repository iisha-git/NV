name: Build demo images
on:
  push:
    branches: [demo-local-backend]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ML image
        run: docker build -t ghcr.io/iisha-git/nv-ml:demo NyayVivek-ML && docker push ghcr.io/iisha-git/nv-ml:demo
      - name: Build + push web image
        run: docker build -f server/Dockerfile -t ghcr.io/iisha-git/nv-web:demo . && docker push ghcr.io/iisha-git/nv-web:demo
